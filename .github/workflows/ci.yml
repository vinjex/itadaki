name: CI

on:
  push:
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
      - run: scripts/test.sh
      - name: Committed panel matches its source
        run: scripts/build-panel.sh && git diff --exit-code custom_components/itadaki/frontend

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the manifest version
        run: test "v$(jq -r .version custom_components/itadaki/manifest.json)" = "$GITHUB_REF_NAME"
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
