name: CI

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
      - run: scripts/test.sh
      # Dependency update PRs cannot rebuild the panel themselves, so it is rebuilt here.
      - name: Committed panel matches its source
        run: |
          scripts/build-panel.sh
          git diff --quiet custom_components/itadaki/frontend && exit 0
          case "$GITHUB_HEAD_REF" in renovate/*) ;; *) git diff --stat; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Internal: Rebuild the panel" custom_components/itadaki/frontend
          git push

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches the manifest version
        run: test "v$(jq -r .version custom_components/itadaki/manifest.json)" = "$GITHUB_REF_NAME"
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
